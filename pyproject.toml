[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-normalizer"
version = "0.1.0"
description = "Product normalizer learning project"
requires-python = ">=3.10"

[project.optional-dependencies]
mcp = ["mcp[cli]==2.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "product_normalizer*"]
namespaces = true

[tool.uv]
managed = false
